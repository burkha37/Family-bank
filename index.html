<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Cloud Bank</title>

    <style>
        :root {
            --primary: #2e7d32;
            --secondary: #1565c0;
            --background: #f5f5f5;
            --card: #ffffff;
            --text: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,.1);
        }

        h1, h2, h3 {
            text-align: center;
            color: #222;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        .btn-parent {
            background: var(--primary);
            color: white;
        }

        .btn-child {
            background: var(--secondary);
            color: white;
        }

        .btn-sync {
            background: #ff9800;
            color: white;
            margin-bottom: 15px;
        }

        .btn-back {
            background: #757575;
            color: white;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .balance-box {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            gap: 10px;
        }

        .balance-card {
            flex: 1;
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #c8e6c9;
        }

        .balance-card.savings {
            background: #e3f2fd;
            border-color: #bbdefb;
        }

        .balance-num {
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }

        .tx-list {
            max-height: 200px;
            overflow-y: auto;
            background: #fafafa;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 6px;
            list-style: none;
            margin: 0;
        }

        .tx-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .tx-deposit {
            color: green;
        }

        .tx-withdraw {
            color: red;
        }

        .status {
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .status.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.error {
            display: block;
            background: #ffebee;
            color: #c62828;
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .balance-box {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HOME -->
    <div id="screen-home" class="screen active">
        <h1>🏠 Family Bank</h1>
        <p style="text-align:center;">Select portal to log in</p>

        <button
            class="btn-parent"
            onclick="switchScreen('screen-parent-login')">
            Parent Portal
        </button>

        <button
            class="btn-child"
            onclick="switchScreen('screen-child-login')">
            Kids Portal
        </button>
    </div>


    <!-- PARENT LOGIN -->
    <div id="screen-parent-login" class="screen">

        <h2>🔒 Parent Login</h2>

        <input
            type="password"
            id="parent-pin"
            placeholder="Enter Parent PIN">

        <button
            class="btn-parent"
            onclick="loginParent()">
            Login
        </button>

        <button
            class="btn-back"
            onclick="switchScreen('screen-home')">
            Back
        </button>

    </div>


    <!-- PARENT DASHBOARD -->
    <div id="screen-parent-dash" class="screen">

        <h2>🛠️ Parent Control Panel</h2>

        <button
            class="btn-sync"
            onclick="fetchCloudData(true)">
            🔄 Sync with Database Cloud
        </button>

        <div id="parent-status" class="status"></div>

        <label>
            <b>1. Select Child:</b>
        </label>

        <select
            id="parent-child-select"
            onchange="updateParentView()">
        </select>


        <div class="balance-box">

            <div class="balance-card">
                Normal Balance
                <div
                    id="p-normal-bal"
                    class="balance-num">
                    $0.00
                </div>
            </div>

            <div class="balance-card savings">
                Savings Balance
                <div
                    id="p-savings-bal"
                    class="balance-num">
                    $0.00
                </div>
            </div>

        </div>


        <hr>


        <label>
            <b>2. Add Transaction:</b>
        </label>


        <select id="tx-account">

            <option value="normal">
                Normal Account
            </option>

            <option value="savings">
                Savings Account
            </option>

        </select>


        <select id="tx-type">

            <option value="deposit">
                Deposit (+)
            </option>

            <option value="withdraw">
                Withdraw (-)
            </option>

        </select>


        <input
            type="number"
            id="tx-amount"
            step="0.01"
            min="0"
            placeholder="Amount ($)">


        <input
            type="text"
            id="tx-reason"
            placeholder="Reason (Birthday, Chores, etc.)">


        <button
            class="btn-parent"
            onclick="submitTransaction()">
            Apply Cloud Transaction
        </button>


        <button
            class="btn-back"
            onclick="logout()"
            style="margin-top:20px;">
            Logout
        </button>

    </div>


    <!-- CHILD LOGIN -->
    <div id="screen-child-login" class="screen">

        <h2>👦 Kid Login</h2>

        <label>
            Select Your Name:
        </label>

        <select id="child-login-select"></select>


        <input
            type="password"
            id="child-pin"
            maxlength="4"
            inputmode="numeric"
            placeholder="Enter your 4-digit PIN">


        <button
            class="btn-child"
            onclick="loginChild()">
            View My Balances
        </button>


        <button
            class="btn-back"
            onclick="switchScreen('screen-home')">
            Back
        </button>

    </div>


    <!-- CHILD DASHBOARD -->
    <div id="screen-child-dash" class="screen">

        <h2 id="child-welcome">
            Welcome!
        </h2>


        <div class="balance-box">

            <div class="balance-card">

                🛒 Spending Money

                <div
                    id="c-normal-bal"
                    class="balance-num">
                    $0.00
                </div>

            </div>


            <div class="balance-card savings">

                🐷 Piggy Bank (Savings)

                <div
                    id="c-savings-bal"
                    class="balance-num">
                    $0.00
                </div>

            </div>

        </div>


        <h3>📜 Recent History</h3>

        <ul
            id="child-tx-list"
            class="tx-list">
        </ul>


        <button
            class="btn-back"
            onclick="switchScreen('screen-home')"
            style="margin-top:20px;">
            Logout
        </button>

    </div>

</div>



<script>

    /*
    =====================================================
    SUPABASE SETTINGS
    =====================================================
    */

    const API_URL =
        "https://frgmoryrkwtytyngxgnn.supabase.co/rest/v1/kids_money";

    const API_KEY =
        "sb_publishable_zVBgAlXVc182th_LDjIa4g_XStuTYk7";

    const PARENT_PIN = "1234";


    /*
    =====================================================
    DATA
    =====================================================
    */

    let cachedKidsData = [];


    /*
    =====================================================
    SUPABASE REQUEST
    =====================================================
    */

    function makeCloudRequest(
        url,
        method,
        body,
        callback
    ) {

        var xhr = new XMLHttpRequest();

        xhr.open(
            method,
            url,
            true
        );


        xhr.setRequestHeader(
            "apikey",
            API_KEY
        );


        xhr.setRequestHeader(
            "Authorization",
            "Bearer " + API_KEY
        );


        xhr.setRequestHeader(
            "Content-Type",
            "application/json"
        );


        xhr.setRequestHeader(
            "Prefer",
            "return=representation"
        );


        xhr.onreadystatechange =
            function() {

                if (xhr.readyState !== 4) {
                    return;
                }


                if (
                    xhr.status >= 200 &&
                    xhr.status < 300
                ) {

                    try {

                        var data =
                            xhr.responseText
                                ? JSON.parse(xhr.responseText)
                                : [];

                        callback(
                            null,
                            data
                        );

                    } catch (e) {

                        console.error(
                            "JSON parsing error:",
                            e
                        );

                        callback(
                            "The database returned invalid data.",
                            null
                        );

                    }

                } else {

                    console.error(
                        "Supabase HTTP Error:",
                        xhr.status,
                        xhr.responseText
                    );


                    callback(
                        "HTTP " +
                        xhr.status +
                        ": " +
                        xhr.responseText,
                        null
                    );

                }
            };


        xhr.timeout = 10000;


        xhr.ontimeout =
            function() {

                callback(
                    "Connection timed out.",
                    null
                );

            };


        xhr.onerror =
            function() {

                callback(
                    "Network connection error.",
                    null
                );

            };


        xhr.send(
            body
                ? JSON.stringify(body)
                : null
        );

    }



    /*
    =====================================================
    LOAD KIDS FROM SUPABASE
    =====================================================
    */

    function fetchCloudData(showAlert) {

        if (
            typeof showAlert === "undefined"
        ) {
            showAlert = true;
        }


        var url =
            API_URL +
            "?select=id,name,pin,history,normal_balance,savings_balance" +
            "&order=id.asc";


        makeCloudRequest(
            url,
            "GET",
            null,

            function(err, data) {

                /*
                ----------------------------
                DATABASE ERROR
                ----------------------------
                */

                if (err) {

                    console.error(
                        "Supabase read error:",
                        err
                    );


                    showStatus(
                        "Could not load Supabase data.",
                        "error"
                    );


                    if (showAlert) {

                        alert(
                            "Supabase could not load the kids' accounts.\n\n" +
                            "Error:\n" +
                            err
                        );

                    }

                    return;
                }



                /*
                ----------------------------
                NO ROWS RETURNED
                ----------------------------
                */

                if (
                    !Array.isArray(data) ||
                    data.length === 0
                ) {

                    console.error(
                        "Supabase returned no rows:",
                        data
                    );


                    showStatus(
                        "Supabase returned no child records.",
                        "error"
                    );


                    if (showAlert) {

                        alert(
                            "Supabase connected, but no kids were returned.\n\n" +
                            "This usually means the table permissions or RLS policy needs to be checked."
                        );

                    }

                    return;
                }



                /*
                ----------------------------
                VERIFY DATABASE IDS
                ----------------------------
                */

                var missingId =
                    data.find(
                        function(kid) {

                            return (
                                kid.id === null ||
                                kid.id === undefined
                            );

                        }
                    );


                if (missingId) {

                    console.error(
                        "Child missing ID:",
                        missingId
                    );


                    showStatus(
                        "A child record is missing its database ID.",
                        "error"
                    );


                    if (showAlert) {

                        alert(
                            "Supabase returned " +
                            missingId.name +
                            " without a database ID."
                        );

                    }

                    return;
                }



                /*
                ----------------------------
                CLEAN UP RETURNED DATA
                ----------------------------
                */

                data.forEach(
                    function(kid) {

                        if (
                            !Array.isArray(kid.history)
                        ) {

                            kid.history = [];

                        }


                        kid.normal_balance =
                            parseFloat(
                                kid.normal_balance || 0
                            );


                        kid.savings_balance =
                            parseFloat(
                                kid.savings_balance || 0
                            );

                    }
                );



                /*
                ----------------------------
                STORE DATABASE DATA
                ----------------------------
                */

                cachedKidsData = data;


                console.log(
                    "Kids successfully loaded from Supabase:",
                    cachedKidsData
                );



                populateDropdowns();

                updateParentView();


                showStatus(
                    "Connected to Supabase ✓",
                    "success"
                );


                if (showAlert) {

                    alert(
                        "Database synced successfully! 🎉"
                    );

                }

            }
        );

    }



    /*
    =====================================================
    STATUS MESSAGE
    =====================================================
    */

    function showStatus(
        message,
        type
    ) {

        var status =
            document.getElementById(
                "parent-status"
            );


        if (!status) {
            return;
        }


        status.textContent =
            message;


        status.className =
            "status " + type;

    }



    /*
    =====================================================
    DROPDOWNS
    =====================================================
    */

    function populateDropdowns() {

        var pSelect =
            document.getElementById(
                "parent-child-select"
            );


        var cSelect =
            document.getElementById(
                "child-login-select"
            );


        if (
            !pSelect ||
            !cSelect
        ) {
            return;
        }


        var currentP =
            pSelect.value;


        var currentC =
            cSelect.value;


        pSelect.innerHTML =
            "";


        cSelect.innerHTML =
            "";



        cachedKidsData.forEach(
            function(kid) {

                /*
                Parent dropdown
                */

                var pOption =
                    document.createElement(
                        "option"
                    );


                pOption.value =
                    kid.name;


                pOption.textContent =
                    kid.name;


                pSelect.appendChild(
                    pOption
                );



                /*
                Child dropdown
                */

                var cOption =
                    document.createElement(
                        "option"
                    );


                cOption.value =
                    kid.name;


                cOption.textContent =
                    kid.name;


                cSelect.appendChild(
                    cOption
                );

            }
        );



        if (currentP) {
            pSelect.value =
                currentP;
        }


        if (currentC) {
            cSelect.value =
                currentC;
        }


        if (
            !pSelect.value &&
            pSelect.options.length > 0
        ) {

            pSelect.selectedIndex =
                0;

        }


        if (
            !cSelect.value &&
            cSelect.options.length > 0
        ) {

            cSelect.selectedIndex =
                0;

        }


        updateParentView();

    }



    /*
    =====================================================
    SCREEN SWITCHING
    =====================================================
    */

    function switchScreen(
        screenId
    ) {

        document
            .querySelectorAll(
                ".screen"
            )
            .forEach(
                function(screen) {

                    screen.classList.remove(
                        "active"
                    );

                }
            );


        var target =
            document.getElementById(
                screenId
            );


        if (target) {

            target.classList.add(
                "active"
            );

        } else {

            console.error(
                "Screen not found:",
                screenId
            );

        }

    }



    /*
    =====================================================
    PARENT LOGIN
    =====================================================
    */

    function loginParent() {

        var pin =
            document.getElementById(
                "parent-pin"
            ).value;


        if (
            pin === PARENT_PIN
        ) {

            document.getElementById(
                "parent-pin"
            ).value = "";


            switchScreen(
                "screen-parent-dash"
            );


            /*
            Load current database rows
            every time parent logs in.
            */

            fetchCloudData(false);

        } else {

            alert(
                "Incorrect Parent PIN!"
            );

        }

    }



    /*
    =====================================================
    UPDATE PARENT BALANCES
    =====================================================
    */

    function updateParentView() {

        var select =
            document.getElementById(
                "parent-child-select"
            );


        if (!select) {
            return;
        }


        var kid =
            cachedKidsData.find(
                function(k) {

                    return (
                        k.name ===
                        select.value
                    );

                }
            );


        if (!kid) {

            document.getElementById(
                "p-normal-bal"
            ).innerText =
                "$0.00";


            document.getElementById(
                "p-savings-bal"
            ).innerText =
                "$0.00";


            return;
        }


        document.getElementById(
            "p-normal-bal"
        ).innerText =
            "$" +
            parseFloat(
                kid.normal_balance || 0
            ).toFixed(2);


        document.getElementById(
            "p-savings-bal"
        ).innerText =
            "$" +
            parseFloat(
                kid.savings_balance || 0
            ).toFixed(2);

    }



    /*
    =====================================================
    ADD / WITHDRAW MONEY
    =====================================================
    */

    function submitTransaction() {

        var name =
            document.getElementById(
                "parent-child-select"
            ).value;


        var account =
            document.getElementById(
                "tx-account"
            ).value;


        var type =
            document.getElementById(
                "tx-type"
            ).value;


        var amount =
            parseFloat(
                document.getElementById(
                    "tx-amount"
                ).value
            );


        var reason =
            document.getElementById(
                "tx-reason"
            ).value.trim();


        if (!reason) {
            reason =
                "Allowance/Gift";
        }



        /*
        Validate amount
        */

        if (
            isNaN(amount) ||
            amount <= 0
        ) {

            alert(
                "Enter a valid amount."
            );

            return;
        }



        /*
        Find selected child
        */

        var kid =
            cachedKidsData.find(
                function(k) {

                    return (
                        k.name === name
                    );

                }
            );


        if (!kid) {

            alert(
                "Could not find that child.\n\n" +
                "Press Sync with Database Cloud and try again."
            );

            return;
        }



        /*
        IMPORTANT:
        Verify that this is a real
        Supabase database row.
        */

        if (
            kid.id === null ||
            kid.id === undefined
        ) {

            console.error(
                "Kid has no database ID:",
                kid
            );


            alert(
                "This child does not have a database ID.\n\n" +
                "Press Sync with Database Cloud and try again."
            );

            return;
        }



        /*
        Calculate new balances
        */

        var modifier =
            type === "deposit"
                ? 1
                : -1;


        var newNormal =
            parseFloat(
                kid.normal_balance || 0
            );


        var newSavings =
            parseFloat(
                kid.savings_balance || 0
            );


        if (
            account === "normal"
        ) {

            newNormal +=
                amount * modifier;

        } else {

            newSavings +=
                amount * modifier;

        }



        /*
        Do not allow negative balances
        */

        if (
            newNormal < 0 ||
            newSavings < 0
        ) {

            alert(
                "The balance cannot go below $0.00."
            );

            return;
        }



        /*
        Transaction history
        */

        var history =
            Array.isArray(kid.history)
                ? kid.history.slice()
                : [];


        history.unshift({

            date:
                new Date().toISOString(),

            account:
                account,

            type:
                type,

            amount:
                Number(
                    amount.toFixed(2)
                ),

            reason:
                reason

        });


        /*
        Keep last 100 transactions
        */

        if (
            history.length > 100
        ) {

            history =
                history.slice(
                    0,
                    100
                );

        }



        /*
        Data to send to Supabase
        */

        var updatedKid = {

            normal_balance:
                Number(
                    newNormal.toFixed(2)
                ),

            savings_balance:
                Number(
                    newSavings.toFixed(2)
                ),

            history:
                history

        };



        /*
        ID 1 = Charlie
        ID 2 = Jackie

        Supabase will update only the
        selected database row.
        */

        var updateURL =
            API_URL +
            "?id=eq." +
            encodeURIComponent(
                kid.id
            );



        console.log(
            "Updating database row:",
            kid.id,
            updatedKid
        );



        makeCloudRequest(
            updateURL,
            "PATCH",
            updatedKid,

            function(err, data) {

                if (err) {

                    console.error(
                        "Transaction error:",
                        err
                    );


                    alert(
                        "Transaction failed.\n\n" +
                        "Supabase error:\n" +
                        err +
                        "\n\n" +
                        "If this mentions permission or row-level security, the Supabase RLS policy needs to be updated."
                    );

                    return;
                }



                /*
                Update local copy
                */

                kid.normal_balance =
                    updatedKid.normal_balance;


                kid.savings_balance =
                    updatedKid.savings_balance;


                kid.history =
                    updatedKid.history;



                updateParentView();



                /*
                Clear form
                */

                document.getElementById(
                    "tx-amount"
                ).value = "";


                document.getElementById(
                    "tx-reason"
                ).value = "";



                var sign =
                    type === "deposit"
                        ? "+"
                        : "-";


                alert(
                    "Transaction saved! 🎉\n\n" +
                    sign +
                    "$" +
                    amount.toFixed(2) +
                    " to " +
                    name +
                    "'s " +
                    (
                        account === "normal"
                            ? "Normal"
                            : "Savings"
                    ) +
                    " Account."
                );



                /*
                Reload from Supabase
                to verify the saved amount.
                */

                fetchCloudData(false);

            }
        );

    }



    /*
    =====================================================
    CHILD LOGIN
    =====================================================
    */

    function loginChild() {

        var name =
            document.getElementById(
                "child-login-select"
            ).value;


        var pin =
            document.getElementById(
                "child-pin"
            ).value;


        var kid =
            cachedKidsData.find(
                function(k) {

                    return (
                        k.name === name
                    );

                }
            );


        if (!kid) {

            alert(
                "Could not find that child.\n\n" +
                "The database may not have loaded yet."
            );

            return;
        }



        if (
            String(kid.pin) !==
            String(pin)
        ) {

            alert(
                "Incorrect PIN!"
            );

            return;
        }



        document.getElementById(
            "child-pin"
        ).value = "";



        document.getElementById(
            "child-welcome"
        ).innerText =
            "Welcome, " +
            kid.name +
            "!";



        document.getElementById(
            "c-normal-bal"
        ).innerText =
            "$" +
            parseFloat(
                kid.normal_balance || 0
            ).toFixed(2);



        document.getElementById(
            "c-savings-bal"
        ).innerText =
            "$" +
            parseFloat(
                kid.savings_balance || 0
            ).toFixed(2);



        /*
        Transaction history
        */

        var list =
            document.getElementById(
                "child-tx-list"
            );


        list.innerHTML =
            "";


        var history =
            Array.isArray(kid.history)
                ? kid.history
                : [];



        if (
            history.length === 0
        ) {

            var emptyItem =
                document.createElement(
                    "li"
                );


            emptyItem.className =
                "tx-item";


            emptyItem.innerText =
                "No transactions yet.";


            list.appendChild(
                emptyItem
            );

        } else {


            history
                .slice(0, 20)
                .forEach(
                    function(tx) {


                        var li =
                            document.createElement(
                                "li"
                            );


                        li.className =
                            "tx-item";



                        var left =
                            document.createElement(
                                "span"
                            );


                        var right =
                            document.createElement(
                                "span"
                            );



                        left.innerText =
                            tx.reason ||
                            "Transaction";



                        var sign =
                            tx.type === "deposit"
                                ? "+"
                                : "-";


                        right.innerText =
                            sign +
                            "$" +
                            parseFloat(
                                tx.amount || 0
                            ).toFixed(2);



                        right.className =
                            tx.type === "deposit"
                                ? "tx-deposit"
                                : "tx-withdraw";



                        li.appendChild(
                            left
                        );


                        li.appendChild(
                            right
                        );


                        list.appendChild(
                            li
                        );

                    }
                );

        }



        switchScreen(
            "screen-child-dash"
        );

    }



    /*
    =====================================================
    LOGOUT
    =====================================================
    */

    function logout() {

        document.getElementById(
            "parent-pin"
        ).value = "";


        document.getElementById(
            "child-pin"
        ).value = "";


        switchScreen(
            "screen-home"
        );

    }



    /*
    =====================================================
    START APP
    =====================================================
    */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            /*
            Load the actual Supabase rows.

            Charlie should load as ID 1.
            Jackie should load as ID 2.
            */

            fetchCloudData(false);

        }
    );

</script>

</body>
</html>
