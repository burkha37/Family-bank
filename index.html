<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Cloud Bank</title>
    <style>
        :root { --primary: #2e7d32; --secondary: #1565c0; --background: #f5f5f5; --card: #ffffff; --text: #333333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--background); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2, h3 { text-align: center; color: #222; }
        .screen { display: none; }
        .screen.active { display: block; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .btn-parent { background: var(--primary); color: white; }
        .btn-child { background: var(--secondary); color: white; }
        .btn-back { background: #757575; color: white; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .balance-box { display: flex; justify-content: space-between; margin: 15px 0; gap: 10px; }
        .balance-card { flex: 1; background: #e8f5e9; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #c8e6c9; }
        .balance-card.savings { background: #e3f2fd; border-color: #bbdefb; }
        .balance-num { font-size: 24px; font-weight: bold; margin-top: 5px; }
        .tx-list { max-height: 200px; overflow-y: auto; background: #fafafa; border: 1px solid #eee; padding: 10px; border-radius: 6px; list-style: none; margin: 0; }
        .tx-item { padding: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; font-size: 14px; }
        .tx-deposit { color: green; } .tx-withdraw { color: red; }
    </style>
</head>
<body>

<div class="container">
    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen active">
        <h1>🏠 Family Bank</h1>
        <p style="text-align:center;">Select portal to log in</p>
        <button class="btn-parent" onclick="switchScreen('screen-parent-login')">Parent Portal</button>
        <button class="btn-child" onclick="switchScreen('screen-child-login')">Kids Portal</button>
    </div>

    <!-- PARENT LOGIN -->
    <div id="screen-parent-login" class="screen">
        <h2>🔒 Parent Login</h2>
        <input type="password" id="parent-pin" placeholder="Enter Parent PIN (Default: 1234)">
        <button class="btn-parent" onclick="loginParent()">Login</button>
        <button class="btn-back" onclick="switchScreen('screen-home')">Back</button>
    </div>

    <!-- PARENT DASHBOARD -->
    <div id="screen-parent-dash" class="screen">
        <h2>🛠️ Parent Control Panel</h2>
        <label><b>1. Select Child:</b></label>
        <select id="parent-child-select" onchange="updateParentView()"></select>

        <div class="balance-box">
            <div class="balance-card">Normal Balance<div id="p-normal-bal" class="balance-num">$0.00</div></div>
            <div class="balance-card savings">Savings Balance<div id="p-savings-bal" class="balance-num">$0.00</div></div>
        </div>
        <hr>
        <label><b>2. Add Transaction:</b></label>
        <select id="tx-account">
            <option value="normal">Normal Account</option>
            <option value="savings">Savings Account</option>
        </select>
        <select id="tx-type">
            <option value="deposit">Deposit (+)</option>
            <option value="withdraw">Withdraw (-)</option>
        </select>
        <input type="number" id="tx-amount" step="0.01" placeholder="Amount ($)">
        <input type="text" id="tx-reason" placeholder="Reason (e.g., Birthday, Chores)">
        <button class="btn-parent" onclick="submitTransaction()">Apply Cloud Transaction</button>
        <button class="btn-back" onclick="switchScreen('screen-home')" style="margin-top:20px;">Logout</button>
    </div>

    <!-- CHILD LOGIN -->
    <div id="screen-child-login" class="screen">
        <h2>👦 Kid Login</h2>
        <label>Select Your Name:</label>
        <select id="child-login-select"></select>
        <input type="password" id="child-pin" placeholder="Enter your 4-digit PIN">
        <button class="btn-child" onclick="loginChild()">View My Balances</button>
        <button class="btn-back" onclick="switchScreen('screen-home')">Back</button>
    </div>

    <!-- CHILD DASHBOARD -->
    <div id="screen-child-dash" class="screen">
        <h2 id="child-welcome">Welcome!</h2>
        <div class="balance-box">
            <div class="balance-card">🛒 Spending Money<div id="c-normal-bal" class="balance-num">$0.00</div></div>
            <div class="balance-card savings">🐷 Piggy Bank (Savings)<div id="c-savings-bal" class="balance-num">$0.00</div></div>
        </div>
        <h3>📜 Recent History</h3>
        <ul id="child-tx-list" class="tx-list"></ul>
        <button class="btn-back" onclick="switchScreen('screen-home')" style="margin-top:20px;">Logout</button>
    </div>
</div>

<script>
    const API_URL = "https://supabase.co";
    const API_KEY = "sb_publishable_zVBgAlXVc182th_LDjIa4g_XStuTYk7";
    const PARENT_PIN = "1234"; 

    let cachedKidsData = [];

    function makeCloudRequest(url, method, body, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open(method, url, true);
        xhr.setRequestHeader("apikey", API_KEY);
        xhr.setRequestHeader("Authorization", "Bearer " + API_KEY);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.setRequestHeader("Prefer", "return=representation");
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                if (xhr.status >= 200 && xhr.status < 300) {
                    var data = JSON.parse(xhr.responseText);
                    callback(null, data);
                } else {
                    callback(xhr.responseText || "API Error", null);
                }
            }
        };
        xhr.send(body ? JSON.stringify(body) : null);
    }

    function fetchCloudData() {
        makeCloudRequest(API_URL + "?select=*", "GET", null, function(err, data) {
            if (!err && data) {
                cachedKidsData = data;
                populateDropdowns();
            }
        });
    }

    function populateDropdowns() {
        var pSelect = document.getElementById('parent-child-select');
        var cSelect = document.getElementById('child-login-select');
        var currentP = pSelect.value;
        var currentC = cSelect.value;

        pSelect.innerHTML = ""; cSelect.innerHTML = "";
        cachedKidsData.forEach(function(kid) {
            pSelect.innerHTML += "<option value='" + kid.name + "'>" + kid.name + "</option>";
            cSelect.innerHTML += "<option value='" + kid.name + "'>" + kid.name + "</option>";
        });

        if(currentP) pSelect.value = currentP;
        if(currentC) cSelect.value = currentC;
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
        document.getElementById(screenId).classList.add('active');
        fetchCloudData();
    }

    function loginParent() {
        if (document.getElementById('parent-pin').value === PARENT_PIN) {
            document.getElementById('parent-pin').value = '';
            switchScreen('screen-parent-dash');
            updateParentView();
        } else { alert('Incorrect Parent PIN!'); }
    }

    function updateParentView() {
        var name = document.getElementById('parent-child-select').value;
        var kid = cachedKidsData.find(function(k) { return k.name === name; });
        if(!kid) return;
        document.getElementById('p-normal-bal').innerText = "$" + parseFloat(kid.normal_balance || 0).toFixed(2);
        document.getElementById('p-savings-bal').innerText = "$" + parseFloat(kid.savings_balance || 0).toFixed(2);
    }

    function submitTransaction() {
        var name = document.getElementById('parent-child-select').value;
        var account = document.getElementById('tx-account').value;
        var type = document.getElementById('tx-type').value;
        var amount = parseFloat(document.getElementById('tx-amount').value);
        var reason = document.getElementById('tx-reason').value || "Allowance/Gift";

        if (isNaN(amount) || amount <= 0) return alert('Enter a valid amount');
        var kid = cachedKidsData.find(function(k) { return k.name === name; });
        var modifier = type === 'deposit' ? 1 : -1;

        var newNormal = parseFloat(kid.normal_balance || 0);
        var newSavings = parseFloat(kid.savings_balance || 0);
        if (account === 'normal') newNormal += (amount * modifier);
        else newSavings += (amount * modifier);

        var history = kid.history || [];
        history.unshift({ date: new Date().toLocaleDateString(), account: account, type: type, amount: amount, reason: reason });

        var updateUrl = API_URL + "?name=eq." + encodeURIComponent(name);
        var bodyData = { normal_balance: newNormal, savings_balance: newSavings, history: history };

        makeCloudRequest(updateUrl, "PATCH", bodyData, function(err, data) {
            if(!err) {
                alert('Cloud Database Updated!');
                document.getElementById('tx-amount').value = '';
                document.getElementById('tx-reason').value = '';
                fetchCloudData();
                setTimeout(updateParentView, 500);
            } else {
                alert('Database update failed: ' + err);
            }
        });
    }

    function loginChild() {
        var name = document.getElementById('child-login-select').value;
